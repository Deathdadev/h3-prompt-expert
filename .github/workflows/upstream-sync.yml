name: upstream-sync

# Poll the MiniMax Design market endpoint, refresh the vendored skill folder,
# and publish (commit + push + version tag) only when upstream content changed.
# Run manually from the Actions tab right after MiniMax ships a new version.

on:
  schedule:
    # once a day; a market version bump is rare and `npx skills check -g` is instant
    - cron: "13 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync
        run: |
          out="$(bash scripts/upstream-sync.sh | tail -1)"
          echo "$out"
          version="$(printf '%s' "$out" | sed -n 's/.*version=\([^ ]*\).*/\1/p')"

          if git diff --quiet --stat -- skills/h3-prompt-expert upstream/h3-prompt-expert.zip upstream.sha256; then
            echo "upstream unchanged -- nothing to publish"
            exit 0
          fi

          git config author "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git config committer "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git add -A -- skills/h3-prompt-expert upstream/h3-prompt-expert.zip upstream.sha256
          git commit -q -m "sync h3-prompt-expert to v${version}"
          git push origin HEAD

          tag="v${version}"
          if [ "$version" != "" ] && ! git rev-parse --quiet --exact "$tag" >/dev/null; then
            git tag -a "$tag" -m "h3-prompt-expert v${version}"
            git push origin "$tag"
          fi
